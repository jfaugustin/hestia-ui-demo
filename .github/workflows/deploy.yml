name: Deploy Hestia Demo to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'front-office.js'
      - 'front-office.css'
      - 'app-shell.js'
      - 'app-shell.css'
      - 'sw.js'
      - '.github/workflows/deploy.yml'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Hestia demo workflows
        run: |
          node tests/demo-smoke.cjs
          node tests/front-office-smoke.cjs
          node tests/app-shell-smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
