<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b27"><title>HESTIA | Hotel Operating System Demo</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263446;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:#101b27;color:#cdd7de;padding:23px 13px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}.brand{color:#f7f1e7;font-family:Georgia,serif;font-size:31px;letter-spacing:3px;margin:7px 13px 2px}.tagline{color:#a6b4bb;font-size:10px;letter-spacing:2px;margin:0 13px 26px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;color:#b3c1cc;background:transparent;text-align:left;border-radius:9px;padding:11px 13px;display:flex;align-items:center;gap:11px;font-size:13px}.nav button.active,.nav button:hover{background:#2a3945;color:white}.nav .glyph{width:22px;text-align:center;color:#d1a876}.sidefoot{margin-top:auto;border-top:1px solid #344451;padding:16px 12px;color:#96a7b6;font-size:11px;line-height:1.5}.main{flex:1;min-width:0}.topbar{height:74px;background:white;border-bottom:1px solid #e6e9ed;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.prop{font-weight:650;font-size:14px}.subtle{color:#81909c}.topright{display:flex;align-items:center;gap:16px;font-size:13px}.avatar{width:34px;height:34px;display:grid;place-items:center;background:#122633;color:white;border-radius:50%;font-size:11px}.menu{display:none}.content{padding:33px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:27px}h1{font-family:Georgia,serif;font-size:32px;font-weight:500;margin:0 0 6px;color:#182a36}p{margin:0}.muted{color:#7a8997;font-size:13px}.badge{border-radius:6px;padding:5px 9px;font-size:11px;font-weight:650;background:#eef2f5;color:#445769}.badge.good{background:#e1f2e9;color:#237650}.badge.warn{background:#fff1dd;color:#a16a1f}.badge.bad{background:#fae4e1;color:#ac4d42}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.kpi,.panel{background:#fff;border:1px solid #e6e9ec;border-radius:13px;box-shadow:0 2px 8px #202e3c06}.kpi{padding:19px}.kpi .label{font-size:12px;color:#82909c}.kpi .value{font-family:Georgia,serif;font-size:33px;color:#192e3d;margin:9px 0 4px}.kpi .note{font-size:11px;color:#728596}.columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;margin-top:16px}.panel{padding:22px;min-width:0}.paneltitle{font-size:16px;font-weight:700;color:#233847;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;color:#b1824d;text-transform:uppercase}.primary{border:0;background:#b88954;color:white;padding:10px 16px;border-radius:8px;font-weight:650;font-size:12px}.primary:hover{background:#a3733e}.secondary{background:white;color:#263e4d;border:1px solid #d9dfe4;padding:8px 12px;border-radius:8px;font-size:12px}.line{border-top:1px solid #ebedf0;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}.line:first-of-type{border-top:0}.line strong{font-weight:650}.tiny{font-size:11px;color:#8b99a4;margin-top:4px}.chart{height:178px;display:flex;align-items:end;gap:13px;padding:24px 7px 0;border-bottom:1px solid #e3e8ed}.bar{flex:1;background:linear-gradient(#e0b27a,#b7834b);border-radius:5px 5px 0 0;min-height:10px;position:relative}.bar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:#778796}.chartlabels{display:flex;gap:13px;margin-top:9px;font-size:10px;color:#8997a3}.chartlabels span{flex:1;text-align:center}.roomgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.room{border-radius:9px;border:1px solid #dce3e8;background:#f5f8fa;padding:15px 4px;text-align:center;font-weight:700;font-size:13px;cursor:pointer}.room small{display:block;font-size:9px;font-weight:500;margin-top:4px;color:#768894}.room.occupied{background:#e6eef5;border-color:#b3cadd}.room.dirty{background:#fff1df;border-color:#efd7a8}.room.out{background:#f9e4e3;border-color:#eac4c0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;font-size:12px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:#8a98a5;padding:12px 10px;border-bottom:1px solid #e4e8ed}td{padding:13px 10px;border-bottom:1px solid #edf0f2}td strong{color:#263b49}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:35px 10px;text-align:center;color:#85929c}.toast{position:fixed;right:20px;bottom:20px;background:#203445;color:#fff;border-radius:10px;padding:13px 17px;box-shadow:0 10px 30px #20344542;z-index:30;font-size:13px}.modalbg{position:fixed;inset:0;background:#0d1a2799;display:grid;place-items:center;z-index:40;padding:18px}.modal{width:min(480px,100%);border-radius:16px;background:white;padding:25px;box-shadow:0 20px 70px #0003}.modal h2{font:normal 26px Georgia,serif;margin:0 0 7px}.fields{display:grid;gap:12px;margin-top:17px}.fields label{font-size:12px;font-weight:650;color:#526471}.fields input,.fields select{width:100%;margin-top:6px;border:1px solid #dbe1e6;padding:10px;border-radius:8px;background:white;color:#243746}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.footer{font-size:11px;color:#9aa7b1;padding:22px 0}.section{margin-top:18px}.mobileoverlay{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.roomgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.sidebar{position:fixed;z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 50px #0002}.sidebar.open{transform:translateX(0)}.mobileoverlay.on{display:block;position:fixed;inset:0;background:#0007;z-index:19}.menu{display:block;background:none;border:0;font-size:24px;color:#263a47}.topbar{height:65px;padding:0 17px}.topright .desktop{display:none}.content{padding:22px 16px}.heading{align-items:start}h1{font-size:27px}.grid{gap:9px}.kpi{padding:14px}.kpi .value{font-size:27px}.panel{padding:16px}.roomgrid{grid-template-columns:repeat(3,1fr)}.heading .primary{font-size:11px;padding:9px 10px}}
</style></head><body>
<div class="mobileoverlay" id="overlay" onclick="toggleMenu(false)"></div><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand">HESTIA</div><div class="tagline">HOTEL OPERATING SYSTEM</div><nav class="nav" id="nav"></nav><div class="sidefoot">DEMONSTRATION ENVIRONMENT<br>Synthetic data only · Stored in this browser<br><button class="secondary" style="margin-top:9px" onclick="resetDemo()">Reset demo</button></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu" onclick="toggleMenu(true)">☰</button><div><div class="prop">Grand Hotel <span style="font-weight:400;color:#8494a1">/ Demo Property</span></div><div class="tiny">Independent luxury hotel · 120 rooms</div></div></div><div class="topright"><span class="desktop subtle">Business date · November 12, 2026</span><span>◉</span><div class="avatar">HM</div></div></header><div class="content" id="content"></div></main></div><div id="modalroot"></div>
<script>
"use strict";
const NAV=[["Overview","◫"],["Reservations","▤"],["Front Desk","◈"],["Rooms","▦"],["Housekeeping","✦"],["Service Dispatch","⚒"],["Security","◇"],["Financials","▥"],["Intelligence","▧"],["Workforce","♙"]];
const KEY="hestia-demo-v11";
const seed=()=>({rooms:Array.from({length:24},(_,i)=>({id:201+i,status:i%7===0?"dirty":i%5===0?"occupied":"ready"})),reservations:[{id:1001,guest:"Amelia Hart",room:205,arrival:"2026-11-12",departure:"2026-11-15",status:"Reserved"},{id:1002,guest:"Oliver Chen",room:207,arrival:"2026-11-11",departure:"2026-11-14",status:"Checked in"},{id:1003,guest:"Sofia Bennett",room:212,arrival:"2026-11-12",departure:"2026-11-13",status:"Reserved"}],tickets:[{id:1,room:209,title:"Air conditioning inspection",team:"Engineering",status:"Open"},{id:2,room:212,title:"Extra towels",team:"Housekeeping",status:"In progress"},{id:3,room:215,title:"Television remote replacement",team:"Engineering",status:"Complete"}],incidents:[{id:1,title:"Found property logged",location:"Lobby",status:"Open"}],activities:["Operations dashboard initialized","Housekeeping inspection completed · Room 204","Front Office prepared morning arrivals"]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){state=seed()}let page="Overview";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const safe=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill=s=>'<span class="badge '+(s==="Ready"||s==="ready"||s==="Complete"||s==="Checked out"?"good":s==="Open"||s==="dirty"||s==="In progress"||s==="Reserved"?"warn":s==="Out of order"?"bad":"")+'">'+safe(s)+'</span>';
const btn=(label,fn)=>'<button class="secondary" onclick="'+fn+'">'+safe(label)+'</button>';
function toggleMenu(open){document.getElementById("sidebar").classList.toggle("open",open);document.getElementById("overlay").classList.toggle("on",open)}
function nav(p){page=p;toggleMenu(false);render()}
function flash(t){const n=document.createElement("div");n.className="toast";n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function activity(t){state.activities.unshift(t);state.activities=state.activities.slice(0,15);save()}
function header(title,desc,action=""){return '<div class="heading"><div><div class="eyebrow">HESTIA / '+safe(page)+'</div><h1>'+safe(title)+'</h1><p class="muted">'+safe(desc)+'</p></div>'+action+'</div>'}
function panel(title,body){return '<section class="panel"><div class="paneltitle">'+title+'</div>'+body+'</section>'}
function row(title,desc,status){return '<div class="line"><div><strong>'+safe(title)+'</strong><div class="tiny">'+safe(desc)+'</div></div>'+pill(status)+'</div>'}
function kp(name,val,note){return '<div class="kpi"><div class="label">'+name+'</div><div class="value">'+val+'</div><div class="note">'+note+'</div></div>'}
function overview(){let occ=state.rooms.filter(r=>r.status==="occupied").length;const vals=[61,73,68,82,76,87,79];return header("Property Overview","A unified view of your hotel's operations.",'<button class="primary" onclick="openReservation()">+ New reservation</button>')+'<div class="grid">'+kp("Occupancy","87.3%","Illustrative property-wide metric")+kp("Arrivals Today",state.reservations.filter(r=>r.arrival==="2026-11-12").length,"Upcoming check-ins")+kp("Open Service Tickets",state.tickets.filter(t=>t.status!=="Complete").length,"Across all departments")+kp("Revenue Today","$48,260","Illustrative room revenue")+'</div><div class="columns">'+panel("Occupancy trend <span class='+"'muted'"+'>Last 7 days</span>",'<div class="chart">'+vals.map(v=>'<div class="bar" style="height:'+v+'%"><span>'+v+'%</span></div>').join("")+'</div><div class="chartlabels">'+["Fri","Sat","Sun","Mon","Tue","Wed","Thu"].map(x=>'<span>'+x+'</span>').join("")+'</div>')+panel("Operational alerts",row("Rooms requiring attention",state.rooms.filter(r=>r.status==="dirty").length+" rooms awaiting turnover","Open")+row("Engineering follow-ups","Outstanding maintenance tasks","In progress")+row("Expected arrivals","Front office preparation","Reserved"))+'</div><div class="columns">'+panel("Arrivals & reservations",state.reservations.slice(0,5).map(r=>row(r.guest,"Room "+r.room+" · "+r.arrival,r.status)).join(""))+panel("Recent activity",state.activities.slice(0,6).map(x=>'<div class="line"><div>'+safe(x)+'</div></div>').join(""))+'</div>'}
function reservations(){return header("Reservations","Manage the guest stay lifecycle.",'<button class="primary" onclick="openReservation()">+ New reservation</button>')+panel("Reservation register",'<div class="tablewrap"><table><thead><tr><th>Confirmation</th><th>Guest</th><th>Room</th><th>Arrival</th><th>Departure</th><th>Status</th><th>Action</th></tr></thead><tbody>'+state.reservations.map(r=>'<tr><td><strong>#'+r.id+'</strong></td><td>'+safe(r.guest)+'</td><td>'+r.room+'</td><td>'+r.arrival+'</td><td>'+r.departure+'</td><td>'+pill(r.status)+'</td><td>'+ (r.status==="Reserved"?btn("Cancel","changeReservation("+r.id+",'Cancelled')"):"")+'</td></tr>').join("")+'</tbody></table></div>')}
function desk(){return header("Front Desk","Coordinate arrivals, departures, and in-house guests.")+panel("Guest queue",'<div class="tablewrap"><table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+state.reservations.filter(r=>r.status!=="Cancelled").map(r=>'<tr><td><strong>'+safe(r.guest)+'</strong></td><td>'+r.room+'</td><td>'+r.arrival+' → '+r.departure+'</td><td>'+pill(r.status)+'</td><td>'+(r.status==="Reserved"?btn("Check in","changeReservation("+r.id+",'Checked in')"):r.status==="Checked in"?btn("Check out","changeReservation("+r.id+",'Checked out')"):"")+'</td></tr>').join("")+'</tbody></table></div>')}
function roomview(){return header("Rooms","Room inventory and readiness. Select a room to update its status.")+panel("Room status <span class='+"'muted'"+'>Sample floor inventory</span>",'<div class="roomgrid">'+state.rooms.map(r=>'<button class="room '+(r.status==="occupied"?"occupied":r.status==="dirty"?"dirty":r.status==="out"?"out":"")+'" onclick="cycleRoom('+r.id+')">'+r.id+'<small>'+safe(r.status)+'</small></button>').join("")+'</div><p class="tiny" style="margin-top:17px">Demonstration only. Rooms rotate through ready, occupied, dirty, and out of order.</p>')}
function housekeeping(){return header("Housekeeping","Inspect and turn over rooms for the next arrival.")+panel("Rooms awaiting turnover",state.rooms.filter(r=>r.status==="dirty").map(r=>'<div class="line"><div><strong>Room '+r.id+'</strong><div class="tiny">Dirty · Inspection pending</div></div><button class="secondary" onclick="markReady('+r.id+')">Mark ready</button></div>').join("")||'<div class="empty">All demo rooms are ready.</div>')+ '<div class="section">'+panel("Housekeeping progress",row("Rooms ready",state.rooms.filter(r=>r.status==="ready").length+" in sample inventory","Complete")+row("Rooms occupied",state.rooms.filter(r=>r.status==="occupied").length+" in sample inventory","In progress"))+'</div>'}
function services(){return header("Service Dispatch","Centralize hotel service and maintenance requests.",'<button class="primary" onclick="openTicket()">+ New request</button>')+panel("Active service board",state.tickets.map(t=>'<div class="line"><div><strong>'+safe(t.title)+'</strong><div class="tiny">#'+t.id+' · Room '+t.room+' · '+safe(t.team)+'</div></div><div class="actions">'+pill(t.status)+(t.status!=="Complete"?btn(t.status==="Open"?"Start":"Complete","advanceTicket("+t.id+")"):"")+'</div></div>').join(""))}
function security(){return header("Security","Record and track hotel safety incidents.",'<button class="primary" onclick="openIncident()">+ New incident</button>')+panel("Incident log",state.incidents.map(i=>'<div class="line"><div><strong>'+safe(i.title)+'</strong><div class="tiny">Incident #'+i.id+' · '+safe(i.location)+'</div></div><div class="actions">'+pill(i.status)+(i.status!=="Complete"?btn("Resolve","resolveIncident("+i.id+")"):"")+'</div></div>').join(""))}
function finances(){return header("Financials","Illustrative property revenue—not connected to a payment processor.")+'<div class="grid">'+kp("Room Revenue","$48,260","Today · synthetic")+kp("Average Daily Rate","$462","Illustrative")+kp("RevPAR","$403","Illustrative")+kp("Pending Folios","12","Demonstration")+'</div><div class="section">'+panel("Revenue overview",row("Rooms","$39,840","Complete")+row("Food & beverage","$6,510","Complete")+row("Other","$1,910","Complete"))+'</div>'}
function intelligence(){return header("Intelligence","Operational reporting and insight.")+'<div class="grid">'+kp("Occupancy","87.3%","Illustrative")+kp("Service Completion","92%","Illustrative")+kp("Guest Satisfaction","4.7/5","Illustrative")+kp("Room Readiness","96%","Illustrative")+'</div><div class="section">'+panel("Export demo data",'<p class="muted" style="margin-bottom:17px">Download the current synthetic reservation, service, security and room records.</p><button class="primary" onclick="exportDemo()">Export JSON</button>')+'</div>'}
function workforce(){return header("Workforce","Departmental staffing and service coverage.")+panel("Department overview",row("Front Office","6 scheduled · AM/PM coverage","Complete")+row("Housekeeping","11 scheduled · Morning turnover","Complete")+row("Engineering","3 scheduled · On-call rotation","Complete")+row("Security","4 scheduled · 24-hour coverage","Complete"))}
function render(){document.getElementById("nav").innerHTML=NAV.map(([n,g])=>'<button class="'+(page===n?"active":"")+'" data-page="'+n+'"><span class="glyph">'+g+'</span>'+n+'</button>').join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>nav(b.dataset.page));let views={"Overview":overview,"Reservations":reservations,"Front Desk":desk,"Rooms":roomview,"Housekeeping":housekeeping,"Service Dispatch":services,"Security":security,"Financials":finances,"Intelligence":intelligence,"Workforce":workforce};document.getElementById("content").innerHTML=views[page]()+ '<div class="footer">HESTIA · Interactive demonstration only · Synthetic data · No live hotel services</div>'}
function modal(title,fields,done){document.getElementById("modalroot").innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>'+title+'</h2><p class="muted">Demonstration data only</p><form id="newform"><div class="fields">'+fields+'</div><div class="modalactions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit" class="primary">Save</button></div></form></div></div>';document.getElementById("newform").onsubmit=e=>{e.preventDefault();done(new FormData(e.target))}}
function field(label,name,type="text",extra=""){return '<label>'+label+'<input name="'+name+'" type="'+type+'" required '+extra+'></label>'}
function closeModal(){document.getElementById("modalroot").innerHTML=""}
function openReservation(){modal("New reservation",field("Guest name","guest")+field("Room number","room","number",'min="201" max="224"')+field("Arrival","arrival","date")+field("Departure","departure","date"),f=>{const room=Number(f.get("room")),arrival=String(f.get("arrival")),departure=String(f.get("departure"));if(departure<=arrival)return flash("Departure must follow arrival");if(!state.rooms.some(r=>r.id===room))return flash("Room not found");if(state.reservations.some(r=>r.room===room&&!["Cancelled","Checked out"].includes(r.status)&&r.arrival<departure&&arrival<r.departure))return flash("Reservation overlap for this room");state.reservations.unshift({id:Date.now(),guest:String(f.get("guest")).trim(),room,arrival,departure,status:"Reserved"});activity("Reservation created · Room "+room);closeModal();render();flash("Reservation created")})}
function changeReservation(id,status){let r=state.reservations.find(x=>x.id===id);if(!r)return;if(status==="Checked in"){let room=state.rooms.find(x=>x.id===r.room);if(room.status==="dirty"||room.status==="out")return flash("Room not ready for check-in");room.status="occupied"}if(status==="Checked out"){let room=state.rooms.find(x=>x.id===r.room);room.status="dirty"}r.status=status;activity("Reservation #"+id+" · "+status);render();flash("Reservation updated")}
function cycleRoom(id){let r=state.rooms.find(x=>x.id===id);r.status=({ready:"occupied",occupied:"dirty",dirty:"out",out:"ready"})[r.status];activity("Room "+id+" status updated");render()}
function markReady(id){state.rooms.find(x=>x.id===id).status="ready";activity("Housekeeping completed · Room "+id);render();flash("Room ready")}
function openTicket(){modal("New service request",field("Request summary","title")+field("Room number","room","number",'min="201" max="224"')+'<label>Department<select name="team"><option>Engineering</option><option>Housekeeping</option><option>Guest Services</option><option>Security</option></select></label>',f=>{state.tickets.unshift({id:Date.now(),title:String(f.get("title")).trim(),room:Number(f.get("room")),team:String(f.get("team")),status:"Open"});activity("New service ticket created");closeModal();render();flash("Ticket created")})}
function advanceTicket(id){let t=state.tickets.find(x=>x.id===id);t.status=t.status==="Open"?"In progress":"Complete";activity("Service request #"+id+" · "+t.status);render()}
function openIncident(){modal("New security incident",field("Incident summary","title")+field("Location","location"),f=>{state.incidents.unshift({id:Date.now(),title:String(f.get("title")).trim(),location:String(f.get("location")).trim(),status:"Open"});activity("Security incident recorded");closeModal();render();flash("Incident recorded")})}
function resolveIncident(id){state.incidents.find(x=>x.id===id).status="Complete";activity("Incident resolved · #"+id);render()}
function resetDemo(){if(!confirm("Reset all synthetic demo data?"))return;state=seed();save();render();flash("Demo reset")}
function exportDemo(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hestia-demo-data.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
